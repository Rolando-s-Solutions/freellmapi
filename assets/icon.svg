<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark theme background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    
    <!-- Accent gradient for the "F" -->
    <linearGradient id="fGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="50%" style="stop-color:#00b8d4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle inner shadow for depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="rgba(0,0,0,0.3)" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    
    <!-- Circuit pattern -->
    <pattern id="circuitPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 L20 10 M10 0 L10 20" stroke="rgba(0,212,170,0.03)" stroke-width="0.5" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bgGradient)"/>
  
  <!-- Subtle circuit pattern overlay -->
  <rect width="256" height="256" rx="48" fill="url(#circuitPattern)"/>
  
  <!-- Accent ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#fGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- Inner accent ring -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#fGradient)" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Main "F" letter with glow -->
  <text x="128" y="168" font-family="'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" 
        font-size="128" font-weight="800" fill="url(#fGradient)" text-anchor="middle" dominant-baseline="central"
        filter="url(#glow)" letter-spacing="-4">F</text>
  
  <!-- "FREE" label -->
  <text x="128" y="216" font-family="'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif" 
        font-size="20" font-weight="600" fill="#00d4aa" text-anchor="middle" dominant-baseline="central"
        letter-spacing="4" opacity="0.8">FREE</text>
  
  <!-- Subtle highlight on top edge -->
  <path d="M48 16 Q128 8 208 16" fill="none" stroke="rgba(0,212,170,0.15)" stroke-width="2" opacity="0.5"/>
  
  <!-- Small data points decoration -->
  <g fill="#00d4aa" opacity="0.4">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="216" cy="40" r="1.5"/>
    <circle cx="40" cy="216" r="1.5"/>
    <circle cx="216" cy="216" r="2"/>
  </g>
  
  <!-- Connection lines between corner dots (subtle) -->
  <g stroke="#00d4aa" stroke-width="0.5" opacity="0.15">
    <line x1="40" y1="40" x2="128" y2="80"/>
    <line x1="216" y1="40" x2="128" y2="80"/>
    <line x1="40" y1="216" x2="128" y2="176"/>
    <line x1="216" y1="216" x2="128" y2="176"/>
  </g>
</svg>
